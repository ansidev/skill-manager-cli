# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
header = ""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version %}\
    {% if previous.version %}\
        ## [v{{ version | trim_start_matches(pat="v") }}]($REPO/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [v{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        - **{{commit.scope}}**: {% if commit.breaking %} [**breaking**]{% endif %} \
            {{ commit.message | split(pat="\n") | first }} - [{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})\
            {% if commit.remote and commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if commit.scope -%}
        {% else -%}
            - {% if commit.breaking %} [**breaking**]{% endif %}\
                {{ commit.message | split(pat="\n") | first }} - [{{ commit.id | truncate(length=7, end="") }}]($REPO/commit/{{ commit.id }})\
                {% if commit.remote and commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}
        {% endif -%}
    {% endfor -%}
{% endfor %}\n

"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """

{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [v{{ release.version | trim_start_matches(pat="v") }}]: \
            $REPO/compare/{{ release.previous.version }}..{{ release.version }}
    {% elif release.version -%}
        [v{{ release.version | trim_start_matches(pat="v") }}]: \
            $REPO/tree/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: $REPO/compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Always render the version section, even when there are no commits (e.g. `--tag` on HEAD)
render_always = true
# postprocessors
postprocessors = [
    # Replace the placeholder `<REPO>` with a URL.
    { pattern = '\$REPO', replace = "https://github.com/ansidev/skill-manager-cli" }, # replace repository URL
    { pattern = 'Le Minh Tri', replace = "ansidev" },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Keep commits that do not match the conventional commits specification;
# the catch-all parser below groups them instead of dropping them silently.
filter_unconventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Check spelling of the commit with https://github.com/crate-ci/typos
    # If the spelling is incorrect, it will be automatically fixed.
    { pattern = '.*', replace_command = 'typos --write-changes -' },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    # Skip all other merge commits; their subject commits are already listed.
    { message = '^Merge ', skip = true },
    { message = "^chore\\(release\\):", skip = true },

    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Revert" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^chore", group = "Miscellaneous Chores" },
    { body = ".*security", group = "Security" },
    # Catch-all: keep any remaining message (e.g. the initial non-conventional commits) grouped.
    { message = ".*", group = "Miscellaneous Chores" },
]

[bump]
# Version used when the repo has no tags yet; keeps the "v" prefix so the
# bumped version matches `tag_pattern` above.
initial_tag = "v0.1.0"

[remote.github]
owner = "ansidev"
repo = "skill-manager-cli"
