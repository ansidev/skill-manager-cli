name: publish_release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

env:
  VERSION_TAG_PREFIX: "v"

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write
    # only merge pull requests that begin with 'release/' or 'hotfix/'
    if: github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_TOKEN }}
          # needed by "gh pr create"
          fetch-depth: 0

      - name: Set release type as release
        if: startsWith(github.head_ref, 'release/')
        run: echo "RELEASE_TYPE=release" >> "$GITHUB_ENV"

      - name: Set release type as hotfix
        if: startsWith(github.head_ref, 'hotfix/')
        run: echo "RELEASE_TYPE=hotfix" >> "$GITHUB_ENV"

      - name: Extract version from release branch
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BRANCH_PREFIX: '${{ env.RELEASE_TYPE }}/'
        run: |
          RELEASE_VERSION=${BRANCH_NAME#"$BRANCH_PREFIX"}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Publish release
        uses: ghacts/gitflow/publish-release@main
        with:
          token: ${{ secrets.GH_TOKEN }}
          release-type: ${{ env.RELEASE_TYPE }}
          release-branch-prefix: '${{ env.RELEASE_TYPE }}/'
          notes-file: '.changes/${{ env.VERSION_TAG_PREFIX }}${{ env.RELEASE_VERSION }}.md'

      - name: Checkout published release tag
        env:
          RELEASE_TAG: ${{ env.VERSION_TAG_PREFIX }}${{ env.RELEASE_VERSION }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git checkout --detach "$RELEASE_TAG"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      - name: Build and upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: goreleaser release --clean --config .goreleaser.yaml

      - name: Generate and publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ env.VERSION_TAG_PREFIX }}${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          assets_dir=$(mktemp -d)
          trap 'rm -rf "$assets_dir"' EXIT
          gh release download "$RELEASE_TAG" --dir "$assets_dir" \
            --pattern "skill-manager-cli_${RELEASE_VERSION}_*.tar.gz" \
            --pattern "skill-manager-cli_${RELEASE_VERSION}_checksums.txt"
          ASSET_DIR="$assets_dir" bash .github/scripts/update-formula.sh "$RELEASE_TAG" "$assets_dir/skill-manager-cli.rb"
          latest=$(gh release view --json tagName --jq .tagName)
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "Release $RELEASE_TAG is not the latest release ($latest); skipping formula update."
            exit 0
          fi
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Formula
          cp "$assets_dir/skill-manager-cli.rb" Formula/skill-manager-cli.rb
          if git diff --quiet -- Formula/skill-manager-cli.rb && [ -z "$(git ls-files --others --exclude-standard Formula/skill-manager-cli.rb)" ]; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/skill-manager-cli.rb
          git commit -m "chore: update Homebrew formula to $RELEASE_VERSION"
          git push origin HEAD:main
