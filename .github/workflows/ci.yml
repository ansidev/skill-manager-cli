name: Go CI
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    strategy:
      matrix:
        os:
          # pinned: ubuntu-latest is migrating to 26.04; fall back to ubuntu-24.04 if it breaks
          # (https://github.com/actions/runner-images/issues/14748)
          - ubuntu-26.04
          - macos-latest
          - windows-latest
        go-version:
          - '1.27'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Run Go CI
        uses: ghacts/go@main
        with:
          go-version: ${{ matrix.go-version }}
          skip-upload-artifact: true
          # artifact-name: "resume-${{ matrix.os }}-go-${{ matrix.go-version }}"
