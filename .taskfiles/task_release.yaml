# https://taskfile.dev

version: "3"

env:
  TAG_PREFIX: v
  CHANGES_DIR: .changes
  CHANGELOG_FILE: CHANGELOG.md

vars:
  VERSION_FILE: main.go

tasks:
  prepare:
    desc: Install tools
    cmds:
      - go install github.com/miniscruff/changie@latest
      - brew install git-cliff

  batch_changelog:
    desc: Generate changelog for existing git tags
    cmds:
      - mkdir -p ${CHANGES_DIR}
      - rm ${CHANGES_DIR}/${TAG_PREFIX}*.md || true
      - |
        for VERSION_TAG in $(git -c 'versionsort.suffix=-' tag --list --sort=v:refname); do
          PREV_TAG=$(git -c 'versionsort.suffix=-' tag --list --sort=v:refname | awk -v t="${VERSION_TAG}" '$0==t{exit} {last=$0} END{print last}')
          if [ -z "${PREV_TAG}" ]; then
            # First tag: no previous tag, range from the root commit (itself excluded)
            PREV_TAG=$(git rev-list --max-parents=0 "${VERSION_TAG}" | tail -1)
          fi
          git-cliff --strip all "${PREV_TAG}..${VERSION_TAG}" --output ${CHANGES_DIR}/${VERSION_TAG}.md
        done
    silent: true

  changelog:
    desc: Generate changelog for an existing version
    vars:
      VERSION_TAG: ${TAG_PREFIX}{{.VERSION}}
    cmds:
      - mkdir -p ${CHANGES_DIR}
      - |
        VERSION_TAG="{{.VERSION_TAG}}"
        PREV_TAG=$(git -c 'versionsort.suffix=-' tag --list --sort=v:refname | awk -v t="${VERSION_TAG}" '$0==t{exit} {last=$0} END{print last}')
        if [ -z "${PREV_TAG}" ]; then
          # First tag: no previous tag, range from the root commit (itself excluded)
          PREV_TAG=$(git rev-list --max-parents=0 "${VERSION_TAG}" | tail -1)
        fi
        git-cliff --strip all "${PREV_TAG}..${VERSION_TAG}" --output ${CHANGES_DIR}/${VERSION_TAG}.md
    silent: true

  changelog_next:
    desc: Generate changelog for a new version
    vars:
      VERSION_TAG: ${TAG_PREFIX}{{.VERSION}}
    cmds:
      - mkdir -p ${CHANGES_DIR}
      - git-cliff --strip all --unreleased --tag {{.VERSION_TAG}} --output ${CHANGES_DIR}/{{.VERSION_TAG}}.md
    silent: true

  commit_release:
    desc: Create release commit
    vars:
      VERSION_TAG: ${TAG_PREFIX}{{.VERSION}}
    cmds:
      - git add ${CHANGELOG_FILE}
      - git add {{.CHANGES_DIR}}/{{.VERSION_TAG}}.md
      - git add {{.VERSION_FILE}}
      - |
        git commit -m "chore(release): {{.VERSION_TAG}}"
    silent: true

  create:
    desc: Bump version and generate release commit (pass a version to override the auto bump)
    vars:
      VERSION_TAG:
        sh: if [ -n "{{.VERSION}}" ]; then echo "${TAG_PREFIX}{{.VERSION}}"; else git-cliff --bumped-version; fi
    cmds:
      - echo "Releasing version {{.VERSION_TAG}}"
      - |
        if [ -f ${CHANGELOG_FILE} ]; then
          # Prepend only the new release section to the existing changelog
          git-cliff -v --unreleased --tag {{.VERSION_TAG}} --prepend ${CHANGELOG_FILE}
        else
          git-cliff -v --unreleased --tag {{.VERSION_TAG}} --output ${CHANGELOG_FILE}
        fi
      - task: changelog_next
      - task: commit_release
    silent: true
